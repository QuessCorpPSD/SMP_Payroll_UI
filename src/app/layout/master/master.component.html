<div class="container-fluid">

  <body style="overflow: unset !important;">
    <div class="card" style="margin:unset !important">
      <app-header></app-header>
    </div>
    <div class="sidebar">
      <li *ngFor="let item of filteredNavItems">
        <a [routerLink]="item.route" class="nav-link" routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }" [ngClass]="{ 'inactive-link': !isActive(item.route) }"
          (click)="onMenuClick(item.route)">
          <i><svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path [attr.d]="item.path" 
                [attr.fill]="isActive(item.route) ? '#302CB3' : '#A9ACB1'"/>
            </svg>
          </i>{{ item.label }}</a>
      </li>
    </div>

    <div class="content">
      <div class="container-fluid p-0">
        <router-outlet></router-outlet>
      </div>

    </div>
  </body>
</div>
